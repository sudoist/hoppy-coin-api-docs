swagger: "2.0"
info:
  title: Hoppy Coin API
  version: "1.0"
  description: |
    Experimental leaderboard API. This specification reflects the known Laravel v1 routes and request validation.
    Responses have not been verified against a running deployment. A browser-exposed API key is not a secret.
host: api.hoppy.co.in
basePath: /api/v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  HoppyApiKey:
    type: apiKey
    name: x-api-key
    in: header
security:
  - HoppyApiKey: []
tags:
  - name: scores
    description: Leaderboard operations
paths:
  /scores:
    get:
      tags: [scores]
      summary: List scores for a level
      parameters:
        - name: level
          in: query
          required: true
          type: string
      responses:
        "200":
          description: Scores for the requested level (response shape pending runtime verification)
        "403":
          description: Missing or invalid API key
        "422":
          description: Invalid or missing level
    post:
      tags: [scores]
      summary: Submit a score
      parameters:
        - name: score
          in: body
          required: true
          schema:
            $ref: "#/definitions/ScoreSubmission"
      responses:
        "200":
          description: Score submitted (response shape pending runtime verification)
        "403":
          description: Missing or invalid API key
        "422":
          description: Validation failed
definitions:
  ScoreSubmission:
    type: object
    required: [name, score, level]
    properties:
      name:
        type: string
        maxLength: 3
      score:
        type: number
      level:
        type: string
